  type: http
  seq: 2
  tags:
    - product-controller

http:
  method: POST
  url: "{{baseUrl}}/api/products"
  body:
    type: json
    data: |-
      {
        "productName": "",
        "skuCode": "",
        "price": 0,
        "stockQuantity": 0,
        "reorderPoint": 0,
