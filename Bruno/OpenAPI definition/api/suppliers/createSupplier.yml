info:
  name: createSupplier
  type: http
  seq: 2
  tags:
    - supplier-controller

http:
  method: POST
  url: "{{baseUrl}}/api/suppliers"
  body:
    type: json
    data: |-
      {
        "supplierName": "",
        "supplierPhone": "",
        "supplierEmail": "",
        "supplierAddress": "",
        "isActive": false,
        "createAt": ""
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/api/suppliers"
      method: POST
      body:
        type: json
        data: |-
          {
            "supplierName": "",
            "supplierPhone": "",
            "supplierEmail": "",
            "supplierAddress": "",
            "isActive": false,
            "createAt": ""
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: "*/*"
      body:
        type: text
        data: |-
          {
            "supplierId": 0,
            "supplierName": "",
            "supplierPhone": "",
            "supplierEmail": "",
            "supplierAddress": "",
            "isActive": false,
            "createAt": ""
          }
