info:
  name: createCategory
  type: http
  seq: 2
  tags:
    - category-controller

http:
  method: POST
  url: "{{baseUrl}}/api/categories"
  body:
    type: json
    data: |-
      {
        "categoryName": "",
        "description": "",
        "isActive": false,
        "createAt": ""
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/api/categories"
      method: POST
      body:
        type: json
        data: |-
          {
            "categoryName": "",
            "description": "",
            "isActive": false,
            "createAt": ""
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: "*/*"
      body:
        type: text
        data: |-
          {
            "categoryId": 0,
            "categoryName": "",
            "description": "",
            "isActive": false,
            "createAt": ""
          }
