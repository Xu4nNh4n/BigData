databaseChangeLog:
  - changeSet:
      id: 050-inventory-batches-and-allocations
      author: codex
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: "0"
            sql: >
              SELECT COUNT(*) FROM products p WHERE p.stock_quantity < p.reserved_quantity
              OR p.reserved_quantity < 0 OR p.damaged_quantity < 0
              OR p.reserved_quantity <> COALESCE((
                SELECT SUM(i.quantity) FROM sales_order_items i
                JOIN sales_orders o ON o.order_id = i.order_id
                WHERE i.product_id = p.product_id
                AND o.inventory_deducted = FALSE AND o.inventory_released = FALSE
              ), 0)
      changes:
        - sqlFile:
            path: db/changelog/changes/013-inventory-batches.sql
            splitStatements: true
