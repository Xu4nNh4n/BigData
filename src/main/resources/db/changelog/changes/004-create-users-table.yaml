databaseChangeLog:
  - changeSet:
      id: 004-create-users-table
      author: nguyen-xuan-nhan
      preConditions:
        - onFail: MARK_RAN
        - not:
            tableExists:
              tableName: users
      changes:
        - createTable:
            tableName: users
            columns:
              - column:
                  name: user_id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: full_name
                  type: VARCHAR(150)
                  constraints:
                    nullable: false

              - column:
                  name: username
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
                    unique: true # không được trùng username
              
              - column:
                  name: password_hash
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: email
                  type: VARCHAR(100)
                  constraints:
                    nullable: true
                    unique: true # không được trùng email

              - column:
                  name: phone
                  type: VARCHAR(20)
                  constraints:
                    nullable: true

              - column:
                  name: is_active
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false

              - column:
                  name: role_id
                  type: BIGINT
                  constraints:
                    nullable: false

                
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
                
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

        # Không cho xóa Role khi vẫn còn User đang sử dụng Role đó.
        - addForeignKeyConstraint:
            baseTableName: users
            baseColumnNames: role_id
            constraintName: fk_users_roles
            referencedTableName: roles
            referencedColumnNames: role_id
            onDelete: RESTRICT

        # MySQL tự cập nhật updated_at khi dữ liệu User thay đổi.
        - sql:
            dbms: mysql
            sql: >
              ALTER TABLE users
              MODIFY COLUMN updated_at TIMESTAMP NOT NULL
              DEFAULT CURRENT_TIMESTAMP
              ON UPDATE CURRENT_TIMESTAMP

      rollback:
        - dropTable:
            tableName: users
