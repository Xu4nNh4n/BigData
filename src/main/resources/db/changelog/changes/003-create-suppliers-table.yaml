databaseChangeLog:
  - changeSet:
      id: 003-create-suppliers-table
      author: nguyen-xuan-nhan
      preConditions:
        - onFail: MARK_RAN
        - not:
            tableExists:
              tableName: suppliers
      changes:
        - createTable:
            tableName: suppliers
            columns:
              - column:
                  name: supplier_id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              
              - column:
                  name: name
                  type: VARCHAR(150)
                  constraints:
                    nullable: false
                    unique: true # Không được trùng tên Supplier.

              - column:
                  name: phone
                  type: VARCHAR(20)
                  constraints:
                    nullable: true
                    unique: true #không được trùng số điện thoại

              - column:
                  name: email
                  type: VARCHAR(100)
                  constraints:
                    nullable: true
                    unique: true #không được trùng email

              - column:
                  name: address
                  type: VARCHAR(255)
                  constraints:
                    nullable: true
                    unique: true #không được trùng địa chỉ

              - column:
                  name: is_active
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
                
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
      rollback:
        - dropTable:
            tableName: suppliers
      
