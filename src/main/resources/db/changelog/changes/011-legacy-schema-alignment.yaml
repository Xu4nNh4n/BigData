databaseChangeLog:
  - changeSet:
      id: 033-align-products-name
      author: codex
      preConditions:
        - onFail: MARK_RAN
        - columnExists:
            tableName: products
            columnName: product_name
        - not:
            columnExists:
              tableName: products
              columnName: name
      changes:
        - renameColumn:
            tableName: products
            oldColumnName: product_name
            newColumnName: name
            columnDataType: VARCHAR(150)

  - changeSet:
      id: 034-align-categories-name
      author: codex
      preConditions:
        - onFail: MARK_RAN
        - columnExists:
            tableName: categories
            columnName: category_name
        - not:
            columnExists:
              tableName: categories
              columnName: name
      changes:
        - renameColumn:
            tableName: categories
            oldColumnName: category_name
            newColumnName: name
            columnDataType: VARCHAR(100)

  - changeSet:
      id: 035-align-suppliers-name
      author: codex
      preConditions:
        - onFail: MARK_RAN
        - columnExists:
            tableName: suppliers
            columnName: supplier_name
        - not:
            columnExists:
              tableName: suppliers
              columnName: name
      changes:
        - renameColumn:
            tableName: suppliers
            oldColumnName: supplier_name
            newColumnName: name
            columnDataType: VARCHAR(150)

  - changeSet:
      id: 036-align-suppliers-phone
      author: codex
      preConditions:
        - onFail: MARK_RAN
        - columnExists:
            tableName: suppliers
            columnName: supplier_phone
        - not:
            columnExists:
              tableName: suppliers
              columnName: phone
      changes:
        - renameColumn:
            tableName: suppliers
            oldColumnName: supplier_phone
            newColumnName: phone
            columnDataType: VARCHAR(20)

  - changeSet:
      id: 037-align-suppliers-email
      author: codex
      preConditions:
        - onFail: MARK_RAN
        - columnExists:
            tableName: suppliers
            columnName: supplier_email
        - not:
            columnExists:
              tableName: suppliers
              columnName: email
      changes:
        - renameColumn:
            tableName: suppliers
            oldColumnName: supplier_email
            newColumnName: email
            columnDataType: VARCHAR(100)

  - changeSet:
      id: 038-align-suppliers-address
      author: codex
      preConditions:
        - onFail: MARK_RAN
        - columnExists:
            tableName: suppliers
            columnName: supplier_address
        - not:
            columnExists:
              tableName: suppliers
              columnName: address
      changes:
        - renameColumn:
            tableName: suppliers
            oldColumnName: supplier_address
            newColumnName: address
            columnDataType: VARCHAR(255)

  - changeSet:
      id: 039-align-refresh_tokens-refresh_token_id
      author: codex
      preConditions:
        - onFail: MARK_RAN
        - columnExists:
            tableName: refresh_tokens
            columnName: token_id
        - not:
            columnExists:
              tableName: refresh_tokens
              columnName: refresh_token_id
      changes:
        - renameColumn:
            tableName: refresh_tokens
            oldColumnName: token_id
            newColumnName: refresh_token_id
            columnDataType: BIGINT
        - sql:
            dbms: mysql
            sql: ALTER TABLE refresh_tokens MODIFY COLUMN refresh_token_id BIGINT NOT NULL AUTO_INCREMENT

  - changeSet:
      id: 040-align-refresh_tokens-expires_at
      author: codex
      preConditions:
        - onFail: MARK_RAN
        - columnExists:
            tableName: refresh_tokens
            columnName: expiry_date
        - not:
            columnExists:
              tableName: refresh_tokens
              columnName: expires_at
      changes:
        - renameColumn:
            tableName: refresh_tokens
            oldColumnName: expiry_date
            newColumnName: expires_at
            columnDataType: TIMESTAMP

  - changeSet:
      id: 041-align-refresh_tokens-revoked
      author: codex
      preConditions:
        - onFail: MARK_RAN
        - columnExists:
            tableName: refresh_tokens
            columnName: is_revoked
        - not:
            columnExists:
              tableName: refresh_tokens
              columnName: revoked
      changes:
        - renameColumn:
            tableName: refresh_tokens
            oldColumnName: is_revoked
            newColumnName: revoked
            columnDataType: BOOLEAN

  - changeSet:
      id: 042-refresh-revoked-at
      author: codex
      preConditions:
        - onFail: MARK_RAN
        - not:
            columnExists:
              tableName: refresh_tokens
              columnName: revoked_at
      changes:
        - addColumn:
            tableName: refresh_tokens
            columns:
              - column:
                  name: revoked_at
                  type: TIMESTAMP

  - changeSet:
      id: 043-stock-movement-actor
      author: codex
      preConditions:
        - onFail: MARK_RAN
        - not:
            columnExists:
              tableName: stock_movements
              columnName: performed_by
      changes:
        - addColumn:
            tableName: stock_movements
            columns:
              - column:
                  name: performed_by
                  type: VARCHAR(100)

  - changeSet:
      id: 044-widen-legacy-customer-phone
      author: codex
      preConditions:
        - onFail: MARK_RAN
        - dbms:
            type: mysql
        - sqlCheck:
            expectedResult: 1
            sql: >
              SELECT COUNT(*) FROM information_schema.COLUMNS WHERE TABLE_SCHEMA = DATABASE()
              AND TABLE_NAME = 'customers' AND COLUMN_NAME = 'phone' AND CHARACTER_MAXIMUM_LENGTH < 20
      changes:
        - modifyDataType:
            tableName: customers
            columnName: phone
            newDataType: VARCHAR(20)

  - changeSet:
      id: 045-widen-legacy-customer-name
      author: codex
      preConditions:
        - onFail: MARK_RAN
        - dbms:
            type: mysql
        - sqlCheck:
            expectedResult: 1
            sql: >
              SELECT COUNT(*) FROM information_schema.COLUMNS WHERE TABLE_SCHEMA = DATABASE()
              AND TABLE_NAME = 'customers' AND COLUMN_NAME = 'full_name' AND CHARACTER_MAXIMUM_LENGTH < 150
      changes:
        - modifyDataType:
            tableName: customers
            columnName: full_name
            newDataType: VARCHAR(150)

  - changeSet:
      id: 046-customer-phone-unique
      author: codex
      preConditions:
        - onFail: MARK_RAN
        - dbms:
            type: mysql
        - sqlCheck:
            expectedResult: 0
            sql: >
              SELECT COUNT(*) FROM information_schema.STATISTICS WHERE TABLE_SCHEMA = DATABASE()
              AND TABLE_NAME = 'customers' AND COLUMN_NAME = 'phone' AND NON_UNIQUE = 0
      changes:
        - addUniqueConstraint:
            tableName: customers
            columnNames: phone
            constraintName: uk_customer_phone

  - changeSet:
      id: 047-customer-email-unique
      author: codex
      preConditions:
        - onFail: MARK_RAN
        - dbms:
            type: mysql
        - sqlCheck:
            expectedResult: 0
            sql: >
              SELECT COUNT(*) FROM information_schema.STATISTICS WHERE TABLE_SCHEMA = DATABASE()
              AND TABLE_NAME = 'customers' AND COLUMN_NAME = 'email' AND NON_UNIQUE = 0
      changes:
        - addUniqueConstraint:
            tableName: customers
            columnNames: email
            constraintName: uk_customer_email
