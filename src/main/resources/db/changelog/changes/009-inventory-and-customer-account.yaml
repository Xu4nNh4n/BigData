databaseChangeLog:
  - changeSet:
      id: 021-product-reserved-quantity
      author: codex
      preConditions:
        - onFail: MARK_RAN
        - not:
            columnExists:
              tableName: products
              columnName: reserved_quantity
      changes:
        - addColumn:
            tableName: products
            columns:
              - column:
                  name: reserved_quantity
                  type: INT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false

  - changeSet:
      id: 022-order-inventory-deducted
      author: codex
      preConditions:
        - onFail: MARK_RAN
        - not:
            columnExists:
              tableName: sales_orders
              columnName: inventory_deducted
      changes:
        - addColumn:
            tableName: sales_orders
            columns:
              - column:
                  name: inventory_deducted
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
        # Phiên bản cũ trừ kho khi tạo đơn. Giữ cách xử lý đó cho các đơn lịch sử.
        - sql:
            sql: UPDATE sales_orders SET inventory_deducted = TRUE

  - changeSet:
      id: 023-order-payment-expiry
      author: codex
      preConditions:
        - onFail: MARK_RAN
        - not:
            columnExists:
              tableName: sales_orders
              columnName: payment_expires_at
      changes:
        - addColumn:
            tableName: sales_orders
            columns:
              - column:
                  name: payment_expires_at
                  type: TIMESTAMP
        - createIndex:
            tableName: sales_orders
            indexName: idx_order_payment_expiry
            columns:
              - column:
                  name: status
              - column:
                  name: payment_expires_at

  - changeSet:
      id: 024-cart-order-id
      author: codex
      preConditions:
        - onFail: MARK_RAN
        - not:
            columnExists:
              tableName: carts
              columnName: order_id
      changes:
        - addColumn:
            tableName: carts
            columns:
              - column:
                  name: order_id
                  type: BIGINT
                  constraints:
                    unique: true
        - addForeignKeyConstraint:
            baseTableName: carts
            baseColumnNames: order_id
            constraintName: fk_carts_orders
            referencedTableName: sales_orders
            referencedColumnNames: order_id
            onDelete: RESTRICT

  - changeSet:
      id: 025-customer-user-link
      author: codex
      preConditions:
        - onFail: MARK_RAN
        - not:
            columnExists:
              tableName: customers
              columnName: user_id
      changes:
        - addColumn:
            tableName: customers
            columns:
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    unique: true
        - addForeignKeyConstraint:
            baseTableName: customers
            baseColumnNames: user_id
            constraintName: fk_customers_users
            referencedTableName: users
            referencedColumnNames: user_id
            onDelete: RESTRICT

  - changeSet:
      id: 026-customer-role
      author: codex
      preConditions:
        - onFail: MARK_RAN
        - sqlCheck:
            expectedResult: 0
            sql: SELECT COUNT(*) FROM roles WHERE UPPER(role_name) IN ('CUSTOMER', 'ROLE_CUSTOMER')
      changes:
        - insert:
            tableName: roles
            columns:
              - column:
                  name: role_name
                  value: ROLE_CUSTOMER
              - column:
                  name: description
                  value: Khách hàng mua sắm online

  - changeSet:
      id: 027-normalize-legacy-order-payments
      author: codex
      changes:
        - sql:
            sql: >
              UPDATE sales_orders SET payment_status = 'PAID'
              WHERE status IN ('PAID', 'DELIVERED') AND payment_status = 'PENDING'
        - sql:
            sql: >
              UPDATE sales_orders SET payment_status = 'CANCELLED', delivery_status = 'CANCELLED', inventory_released = TRUE
              WHERE status = 'CANCELLED' AND payment_status = 'PENDING'
        - sql:
            sql: >
              UPDATE sales_orders SET delivery_status = 'READY'
              WHERE order_type = 'ONLINE' AND status IN ('PAID', 'COD_PENDING')
        - sql:
            sql: >
              UPDATE sales_orders SET delivery_status = 'WAITING_PAYMENT'
              WHERE order_type = 'ONLINE' AND status = 'PENDING_PAYMENT'

  - changeSet:
      id: 028-update-business-timestamps
      author: codex
      changes:
        - sql:
            dbms: mysql
            sql: >
              ALTER TABLE carts MODIFY COLUMN updated_at TIMESTAMP NOT NULL
              DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP
        - sql:
            dbms: mysql
            sql: >
              ALTER TABLE sales_orders MODIFY COLUMN updated_at TIMESTAMP NOT NULL
              DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP
