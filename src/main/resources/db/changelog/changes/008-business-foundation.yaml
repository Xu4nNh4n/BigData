databaseChangeLog:
  - changeSet:
      id: 008-create-customers-table
      author: codex
      preConditions:
        - onFail: MARK_RAN
        - not:
            tableExists:
              tableName: customers
      changes:
        - createTable:
            tableName: customers
            columns:
              - column:
                  name: customer_id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: full_name
                  type: VARCHAR(150)
                  constraints:
                    nullable: false
              - column:
                  name: phone
                  type: VARCHAR(20)
                  constraints:
                    unique: true
              - column:
                  name: email
                  type: VARCHAR(100)
                  constraints:
                    unique: true
              - column:
                  name: address
                  type: VARCHAR(255)
              - column:
                  name: points
                  type: INT
                  defaultValueNumeric: 0
              - column:
                  name: is_active
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

  - changeSet:
      id: 009-create-sales-orders-table
      author: codex
      preConditions:
        - onFail: MARK_RAN
        - not:
            tableExists:
              tableName: sales_orders
      changes:
        - createTable:
            tableName: sales_orders
            columns:
              - column:
                  name: order_id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: order_code
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: order_date
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
              - column:
                  name: customer_id
                  type: BIGINT
              - column:
                  name: user_id
                  type: BIGINT
              - column:
                  name: subtotal
                  type: DECIMAL(18,2)
                  defaultValueNumeric: 0
              - column:
                  name: discount_amount
                  type: DECIMAL(18,2)
                  defaultValueNumeric: 0
              - column:
                  name: total_amount
                  type: DECIMAL(18,2)
                  defaultValueNumeric: 0
              - column:
                  name: payment_method
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(50)
                  defaultValue: PENDING_PAYMENT
                  constraints:
                    nullable: false
              - column:
                  name: payment_status
                  type: VARCHAR(30)
                  defaultValue: PENDING
                  constraints:
                    nullable: false
              - column:
                  name: delivery_status
                  type: VARCHAR(30)
                  defaultValue: NOT_REQUIRED
                  constraints:
                    nullable: false
              - column:
                  name: inventory_released
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: note
                  type: VARCHAR(255)
              - column:
                  name: order_type
                  type: VARCHAR(20)
                  defaultValue: IN_STORE
                  constraints:
                    nullable: false
              - column:
                  name: paid_at
                  type: TIMESTAMP
              - column:
                  name: shipping_address
                  type: VARCHAR(255)
              - column:
                  name: receiver_name
                  type: VARCHAR(150)
              - column:
                  name: receiver_phone
                  type: VARCHAR(20)
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: sales_orders
            baseColumnNames: customer_id
            constraintName: fk_sales_orders_customers
            referencedTableName: customers
            referencedColumnNames: customer_id
            onDelete: SET NULL
        - addForeignKeyConstraint:
            baseTableName: sales_orders
            baseColumnNames: user_id
            constraintName: fk_sales_orders_users
            referencedTableName: users
            referencedColumnNames: user_id
            onDelete: SET NULL

  - changeSet:
      id: 010-create-sales-order-items-table
      author: codex
      preConditions:
        - onFail: MARK_RAN
        - not:
            tableExists:
              tableName: sales_order_items
      changes:
        - createTable:
            tableName: sales_order_items
            columns:
              - column:
                  name: order_item_id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: order_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: product_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: quantity
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: unit_price
                  type: DECIMAL(18,2)
                  constraints:
                    nullable: false
              - column:
                  name: subtotal
                  type: DECIMAL(18,2)
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: sales_order_items
            baseColumnNames: order_id
            constraintName: fk_order_items_orders
            referencedTableName: sales_orders
            referencedColumnNames: order_id
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableName: sales_order_items
            baseColumnNames: product_id
            constraintName: fk_order_items_products
            referencedTableName: products
            referencedColumnNames: product_id
            onDelete: RESTRICT

  - changeSet:
      id: 011-create-carts-table
      author: codex
      preConditions:
        - onFail: MARK_RAN
        - not:
            tableExists:
              tableName: carts
      changes:
        - createTable:
            tableName: carts
            columns:
              - column:
                  name: cart_id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: cart_type
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(20)
                  defaultValue: OPEN
                  constraints:
                    nullable: false
              - column:
                  name: customer_id
                  type: BIGINT
              - column:
                  name: user_id
                  type: BIGINT
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
        - addForeignKeyConstraint:
            baseTableName: carts
            baseColumnNames: customer_id
            constraintName: fk_carts_customers
            referencedTableName: customers
            referencedColumnNames: customer_id
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableName: carts
            baseColumnNames: user_id
            constraintName: fk_carts_users
            referencedTableName: users
            referencedColumnNames: user_id
            onDelete: SET NULL

  - changeSet:
      id: 012-create-cart-items-table
      author: codex
      preConditions:
        - onFail: MARK_RAN
        - not:
            tableExists:
              tableName: cart_items
      changes:
        - createTable:
            tableName: cart_items
            columns:
              - column:
                  name: cart_item_id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: cart_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: product_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: quantity
                  type: INT
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: cart_items
            baseColumnNames: cart_id
            constraintName: fk_cart_items_carts
            referencedTableName: carts
            referencedColumnNames: cart_id
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableName: cart_items
            baseColumnNames: product_id
            constraintName: fk_cart_items_products
            referencedTableName: products
            referencedColumnNames: product_id
            onDelete: RESTRICT

  - changeSet:
      id: 013-create-stock-movements-table
      author: codex
      preConditions:
        - onFail: MARK_RAN
        - not:
            tableExists:
              tableName: stock_movements
      changes:
        - createTable:
            tableName: stock_movements
            columns:
              - column:
                  name: movement_id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: product_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: order_id
                  type: BIGINT
              - column:
                  name: movement_type
                  type: VARCHAR(30)
                  constraints:
                    nullable: false
              - column:
                  name: quantity
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: note
                  type: VARCHAR(255)
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: stock_movements
            baseColumnNames: product_id
            constraintName: fk_stock_movements_products
            referencedTableName: products
            referencedColumnNames: product_id
            onDelete: RESTRICT
        - addForeignKeyConstraint:
            baseTableName: stock_movements
            baseColumnNames: order_id
            constraintName: fk_stock_movements_orders
            referencedTableName: sales_orders
            referencedColumnNames: order_id
            onDelete: SET NULL

  - changeSet:
      id: 014-add-product-version
      author: codex
      preConditions:
        - onFail: MARK_RAN
        - not:
            columnExists:
              tableName: products
              columnName: version
      changes:
        - addColumn:
            tableName: products
            columns:
              - column:
                  name: version
                  type: BIGINT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false

  - changeSet:
      id: 015-add-order-payment-status
      author: codex
      preConditions:
        - onFail: MARK_RAN
        - not:
            columnExists:
              tableName: sales_orders
              columnName: payment_status
      changes:
        - addColumn:
            tableName: sales_orders
            columns:
              - column:
                  name: payment_status
                  type: VARCHAR(30)
                  defaultValue: PENDING
                  constraints:
                    nullable: false

  - changeSet:
      id: 016-add-order-delivery-status
      author: codex
      preConditions:
        - onFail: MARK_RAN
        - not:
            columnExists:
              tableName: sales_orders
              columnName: delivery_status
      changes:
        - addColumn:
            tableName: sales_orders
            columns:
              - column:
                  name: delivery_status
                  type: VARCHAR(30)
                  defaultValue: NOT_REQUIRED
                  constraints:
                    nullable: false

  - changeSet:
      id: 017-add-order-inventory-released
      author: codex
      preConditions:
        - onFail: MARK_RAN
        - not:
            columnExists:
              tableName: sales_orders
              columnName: inventory_released
      changes:
        - addColumn:
            tableName: sales_orders
            columns:
              - column:
                  name: inventory_released
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false

  - changeSet:
      id: 018-add-order-shipping-fields
      author: codex
      preConditions:
        - onFail: MARK_RAN
        - not:
            columnExists:
              tableName: sales_orders
              columnName: shipping_address
      changes:
        - addColumn:
            tableName: sales_orders
            columns:
              - column:
                  name: shipping_address
                  type: VARCHAR(255)
              - column:
                  name: receiver_name
                  type: VARCHAR(150)
              - column:
                  name: receiver_phone
                  type: VARCHAR(20)

  - changeSet:
      id: 019-normalize-existing-order-status
      author: codex
      changes:
        - sql:
            dbms: mysql
            sql: >
              UPDATE sales_orders
              SET status = 'PENDING_PAYMENT', payment_status = 'PENDING'
              WHERE status = 'PENDING'

  - changeSet:
      id: 020-allow-online-orders-without-staff
      author: codex
      changes:
        - sql:
            dbms: mysql
            sql: >
              ALTER TABLE sales_orders
              MODIFY COLUMN user_id BIGINT NULL
