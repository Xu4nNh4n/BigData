databaseChangeLog:
  - changeSet:
      id: 007-update-sales_orders-table
      author: nguyen-xuan-nhan
      changes:
        # 1. Thêm các cột mới
        - addColumn:
            tableName: sales_orders
            columns:
              - column:
                  name: order_type
                  type: VARCHAR(20)
                  defaultValue: 'IN_STORE'
                  constraints:
                    nullable: false
              - column:
                  name: paid_at
                  type: TIMESTAMP
                  constraints:
                    nullable: true
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

        # 2. Đổi giá trị DEFAULT của cột status về 'PENDING'
        - addDefaultValue:
            tableName: sales_orders
            columnName: status
            columnDataType: VARCHAR(50)
            defaultValue: 'PENDING'

        # 3. Tự động cập nhật thời gian updated_at khi có thay đổi
        - sql:
            dbms: mysql
            sql: >
              ALTER TABLE sales_orders
              MODIFY COLUMN updated_at TIMESTAMP NOT NULL
              DEFAULT CURRENT_TIMESTAMP
              ON UPDATE CURRENT_TIMESTAMP

      rollback:
        - dropColumn:
            tableName: sales_orders
            columnName: order_type
        - dropColumn:
            tableName: sales_orders
            columnName: paid_at
        - dropColumn:
            tableName: sales_orders
            columnName: created_at
        - dropColumn:
            tableName: sales_orders
            columnName: updated_at
        - addDefaultValue:
            tableName: sales_orders
            columnName: status
            columnDataType: VARCHAR(50)
            defaultValue: 'PAID'
