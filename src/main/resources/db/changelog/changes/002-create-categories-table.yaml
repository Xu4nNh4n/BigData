databaseChangeLog:
  - changeSet:
      id: 002-create-categories-table
      author: nguyen-xuan-nhan
      preConditions:
        - onFail: MARK_RAN
        - not:
            tableExists:
              tableName: categories
      changes:
        - createTable:
            tableName: categories
            columns:
              - column:
                  name: category_id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
                    unique: true # Không được trùng tên Category.

              - column:
                  name: description
                  type: VARCHAR(255)
                  constraints:
                    nullable: true
                
              - column:
                  name: is_active
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
      rollback:
        - dropTable:
            tableName: categories
      
