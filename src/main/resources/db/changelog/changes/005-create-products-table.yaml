databaseChangeLog:
  - changeSet:
      id: 005-create-products-table
      author: nguyen-xuan-nhan
      preConditions:
        - onFail: MARK_RAN
        - not:
            tableExists:
              tableName: products
      changes:
        - createTable:
            tableName: products
            columns:
              - column:
                  name: product_id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: name
                  type: VARCHAR(150)
                  constraints:
                    nullable: false
                    unique: true

              - column:
                  name: sku_code
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
                    unique: true

              - column:
                  name: price
                  type: DECIMAL(18, 2)
                  constraints:
                    nullable: false

              - column:
                  name: stock_quantity
                  type: INT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false

              - column:
                  name: reorder_point
                  type: INT
                  defaultValueNumeric: 10
                  constraints:
                    nullable: false

              - column:
                  name: expiry_date
                  type: DATE

              - column:
                  name: image_url
                  type: TEXT

              - column:
                  name: is_active
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: category_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: supplier_id
                  type: BIGINT
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: products
            baseColumnNames: category_id
            constraintName: fk_products_categories
            referencedTableName: categories
            referencedColumnNames: category_id
            onDelete: RESTRICT

        - addForeignKeyConstraint:
            baseTableName: products
            baseColumnNames: supplier_id
            constraintName: fk_products_suppliers
            referencedTableName: suppliers
            referencedColumnNames: supplier_id
            onDelete: RESTRICT

        - sql:
            dbms: mysql
            sql: >
              ALTER TABLE products
              MODIFY COLUMN updated_at TIMESTAMP NOT NULL
              DEFAULT CURRENT_TIMESTAMP
              ON UPDATE CURRENT_TIMESTAMP

      rollback:
        - dropTable:
            tableName: products
