databaseChangeLog:
  - changeSet:
      id: 029-create-payment-records
      author: codex
      preConditions:
        - onFail: MARK_RAN
        - not:
            tableExists:
              tableName: payment_records
      changes:
        - createTable:
            tableName: payment_records
            columns:
              - column:
                  name: payment_record_id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: order_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: event_type
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: reference
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: amount
                  type: DECIMAL(18,2)
                  constraints:
                    nullable: false
              - column:
                  name: payment_method
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: confirmed_by
                  type: BIGINT
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: payment_records
            columnNames: order_id, event_type
            constraintName: uk_payment_order_event
        - addForeignKeyConstraint:
            baseTableName: payment_records
            baseColumnNames: order_id
            constraintName: fk_payment_records_orders
            referencedTableName: sales_orders
            referencedColumnNames: order_id
            onDelete: RESTRICT
        - addForeignKeyConstraint:
            baseTableName: payment_records
            baseColumnNames: confirmed_by
            constraintName: fk_payment_records_users
            referencedTableName: users
            referencedColumnNames: user_id
            onDelete: SET NULL

  - changeSet:
      id: 030-product-damaged-quantity
      author: codex
      preConditions:
        - onFail: MARK_RAN
        - not:
            columnExists:
              tableName: products
              columnName: damaged_quantity
      changes:
        - addColumn:
            tableName: products
            columns:
              - column:
                  name: damaged_quantity
                  type: INT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false

  - changeSet:
      id: 031-cart-product-unique
      author: codex
      changes:
        - addUniqueConstraint:
            tableName: cart_items
            columnNames: cart_id, product_id
            constraintName: uk_cart_product
        - createIndex:
            tableName: stock_movements
            indexName: idx_stock_product_movement
            columns:
              - column:
                  name: product_id
              - column:
                  name: movement_id

  - changeSet:
      id: 032-stock-history-baseline
      author: codex
      changes:
        # Chỉ xác lập số dư tại thời điểm nâng cấp, không giả lập lịch sử trước đó.
        - sql:
            dbms: mysql
            sql: >
              INSERT INTO stock_movements (product_id, movement_type, quantity, note)
              SELECT p.product_id, 'BASELINE', p.stock_quantity - COALESCE(m.recorded_quantity, 0),
              'Số dư tồn kho tại thời điểm nâng cấp'
              FROM products p
              LEFT JOIN (
                SELECT product_id, SUM(quantity) AS recorded_quantity FROM stock_movements
                WHERE movement_type IN ('OPENING', 'ADJUSTMENT', 'SALE', 'RETURN', 'CANCEL_RETURN', 'BASELINE')
                GROUP BY product_id
              ) m ON p.product_id = m.product_id
              WHERE p.stock_quantity <> COALESCE(m.recorded_quantity, 0)
